name: Deploy AVD Pilot

# What-If runs on every PR touching Bicep — nothing is applied.
# Apply runs only on merge to main, after a manual approval gate.
#
# Scope: Phase 1 only (main.bicep — networking/storage/host pool/workspace/
# scaling plan). Phase 2 (session hosts) is not wired in here — it needs a
# registration token fetched live via CLI, which doesn't fit a plain
# `deployment create` step. See README "Phase 2" for the manual process.
# AVD_ADMIN_PASSWORD is reserved for whenever Phase 2 gets automated;
# main.bicep itself takes no adminPassword param, so don't pass one here.

on:
  pull_request:
    branches: [main]
    paths:
      - '**.bicep'
      - '**.bicepparam'
      - '.github/workflows/deploy-avd.yml'
  push:
    branches: [main]
    paths:
      - '**.bicep'
      - '**.bicepparam'
  workflow_dispatch:
    inputs:
      confirm_resource_group:
        description: >-
          Type the resource group name (rg-avd-poc) exactly to confirm FULL,
          IRREVERSIBLE deletion of everything in it — host pool, workspace,
          application group, scaling plan, VNet/NSG, session hosts, storage.
          This is a bigger blast radius than teardown-billable.ps1.
        required: true
        type: string

permissions:
  id-token: write   # required for OIDC federated login — no stored secrets
  contents: read

env:
  RESOURCE_GROUP: rg-avd-poc
  LOCATION: uksouth

jobs:
  security-scan:
    # Runs on both PR and push so a regression introduced after a PR was
    # reviewed (e.g. a second commit, or a direct push) still gets caught
    # before deploy — see `needs: security-scan` on the deploy job below.
    # Explicit allow-list (not a negation) so a manual teardown dispatch
    # doesn't spuriously trigger a Bicep scan unrelated to the deletion.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov (IaC misconfiguration scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: bicep
          quiet: true
          # Hard gate: findings here were triaged during rollout — real ones
          # fixed, false positives / deliberate pilot tradeoffs suppressed
          # inline (see modules/*.bicep `checkov:skip` comments and README
          # "Security scanning suppressions"). A regression should fail CI.
          soft_fail: false

      - name: PSRule for Azure (Well-Architected security baseline)
        uses: microsoft/ps-rule@v2.9.0
        with:
          modules: PSRule.Rules.Azure
          baseline: Azure.Pillar.Security
          inputPath: main.bicep
          outcome: Fail
          # TODO: flip to false once the first CI run's findings have been
          # triaged and fixed/suppressed the same way Checkov's were — this
          # couldn't be validated locally in this environment (no standalone
          # bicep binary for PSRule's Bicep expansion; only `az bicep` was
          # available), so don't let an unreviewed first run block deploys.
          continueOnError: true

  what-if:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create --name $RESOURCE_GROUP --location $LOCATION

      - name: What-If
        run: |
          az deployment group what-if \
            --resource-group $RESOURCE_GROUP \
            --template-file main.bicep \
            --parameters params/pilot.bicepparam

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: security-scan
    runs-on: ubuntu-latest
    environment: production   # gives you a manual approval gate in repo settings
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create --name $RESOURCE_GROUP --location $LOCATION

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group $RESOURCE_GROUP \
            --template-file main.bicep \
            --parameters params/pilot.bicepparam

  teardown:
    # Manual-only, full resource-group deletion — irreversible. Only ever
    # fires on an explicit workflow_dispatch, and only from main (dispatch
    # lets a caller pick any branch/tag to run from; refusing anything but
    # main stops an old/modified branch copy of this job being used to
    # bypass the checks below).
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-teardown   # separate approval gate from `production` — see README
    steps:
      - name: Verify confirmation input matches resource group name
        run: |
          if [ "${{ inputs.confirm_resource_group }}" != "$RESOURCE_GROUP" ]; then
            echo "::error::Typed confirmation '${{ inputs.confirm_resource_group }}' does not match resource group name '$RESOURCE_GROUP'. Aborting — nothing was deleted."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show what will be deleted
        run: |
          echo "Deleting resource group '$RESOURCE_GROUP' and everything in it:"
          az resource list --resource-group $RESOURCE_GROUP -o table || true

      - name: Delete resource group (irreversible)
        run: |
          az group delete --name $RESOURCE_GROUP --yes
